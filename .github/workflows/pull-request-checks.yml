name: Pull Request Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Typecheck And Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  python:
    name: Python Compile And Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: steam-test-only
          POSTGRES_DB: steam_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d steam_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      STEAM_REC_TEST_POSTGRES_DSN: postgresql://postgres:steam-test-only@localhost:5432/steam_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: python -m compileall -q app.py backend db_creation tests

      - name: Install API runtime dependencies
        run: python -m pip install -r requirements.docker.txt

      - name: Run Python unit tests
        run: python -m unittest discover -s tests -p "test_*.py"
